name: CI

# The browser app installs docs/wheels/*.whl at runtime, so a stale or missing wheel
# breaks the published site silently. This checks the committed wheel still matches
# the source, and lints.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . ruff

      - name: Lint
        run: ruff check src/

      - name: Import the package
        run: python -c "import delphi_eventdisplay as d; print(d.__version__, d.build, d.build3d)"

      - name: The committed wheel matches the source
        run: |
          set -euo pipefail
          pip wheel --no-deps -q -w /tmp/wheel ./     # explicit path: "pip wheel repo" hits PyPI
          BUILT=$(basename /tmp/wheel/*.whl)
          NAMED=$(python -c "import json;print(json.load(open('docs/wheels/index.json'))['wheel'])")
          echo "built=$BUILT  manifest=$NAMED"
          test -f "docs/wheels/$NAMED" || { echo "::error::docs/wheels/$NAMED is missing"; exit 1; }
          test "$BUILT" = "$NAMED" || {
            echo "::error::docs/wheels/$NAMED is stale (source builds $BUILT) - run docs/build.sh"; exit 1; }

      - name: The site references only files that exist
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, sys
          docs = pathlib.Path("docs")
          missing = []
          for ev in json.loads((docs/"events"/"index.json").read_text())["events"]:
              for key in ("file", "schema", "figure3d"):
                  ref = ev.get(key)
                  if ref and not (docs/ref).exists():
                      missing.append(ref)
          for asset in ("index.html", "app.html", "editor.html", "logo.png", "collection_domains.json"):
              if not (docs/asset).exists():
                  missing.append(asset)
          if missing:
              print("::error::missing from docs/: " + ", ".join(missing)); sys.exit(1)
          print("every referenced file is present")
          PY
