name: Pages

# The official location of this site. docs/index.html is the landing page, docs/app.html
# the display (it reads any edm4hep file in the browser with uproot under Pyodide,
# installing docs/wheels/*.whl), and the manual is built from doc/ into docs/manual/
# here, so it is never committed.
on:
  push:
    branches: [main]
    paths: ["docs/**", "doc/**", "mkdocs.yml", "src/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the manual
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[docs]'
          mkdocs build   # not --strict: the manual deliberately links out to ../app.html

      # Pages is not available for a private repository on a free plan, and this org is
      # on the free plan. Rather than fail every push, check first and skip the publish
      # with a warning; make the repository public (as delphi-edm4hep is) or move the org
      # to a paid plan, and the steps below start running on their own.
      - id: avail
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Pages is enabled; publishing."
          elif gh api -X POST "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Pages enabled for this repository; publishing."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Pages not published::GitHub Pages is unavailable for this repository (a private repo on a free plan cannot use Pages). Make the repository public or move the organisation to a paid plan. The site was built but not deployed."
          fi

      - if: steps.avail.outputs.ready == 'true'
        uses: actions/configure-pages@v5
      - if: steps.avail.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - if: steps.avail.outputs.ready == 'true'
        id: deploy
        uses: actions/deploy-pages@v4

      - if: steps.avail.outputs.ready != 'true'
        name: Site built but not published
        run: |
          echo "### Pages not published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The site built fine (\`docs/\`, manual included) but GitHub Pages is not available for this repository." >> "$GITHUB_STEP_SUMMARY"
          echo "A **private** repository on a **free** plan cannot use Pages." >> "$GITHUB_STEP_SUMMARY"
          echo "Make the repository public, or move the organisation to a paid plan." >> "$GITHUB_STEP_SUMMARY"
